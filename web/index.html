<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A COOKED GOOSE // WEB VOXEL SANDBOX</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #85b8e6;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #eef2f7;
      user-select: none;
    }
    canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
    #hud {
      position: fixed; top: 14px; left: 14px;
      width: 310px;
      background: rgba(16, 22, 34, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 12px;
      line-height: 1.55;
      backdrop-filter: blur(6px);
      pointer-events: none;
    }
    #hud .title {
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #ffb86c;
      margin-bottom: 6px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      padding-bottom: 4px;
    }
    #crosshair {
      position: fixed; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px; font-weight: 700;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 1px 3px rgba(0,0,0,0.7);
      pointer-events: none;
    }
    #bar {
      position: fixed; bottom: 14px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 8px;
      background: rgba(16, 22, 34, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      padding: 6px 10px;
    }
    #bar button {
      background: #27344d; color: #eef2f7;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 999px;
      padding: 6px 12px;
      font: inherit; font-size: 12px;
      cursor: pointer;
    }
    #bar button.active { background: #f27741; color: #fff; border-color: #f27741; }
    #bar button:hover { filter: brightness(1.12); }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="hud">
    <div class="title">VOXEL SANDBOX (WEBGL2 // 25cm)</div>
    <div id="stats">VOXELS: -- | DEBRIS: 0 | FPS: --</div>
    <div id="blast-info">BLASTS: 0 | RADIUS: 0.90</div>
    <div>CLICK CANVAS: LOCK MOUSE</div>
    <div>LMB / F: BLAST &nbsp;|&nbsp; 1/2/3: RADIUS</div>
    <div>WASD + E/Q: FLY &nbsp;|&nbsp; R: RESET</div>
  </div>
  <div id="crosshair">+</div>
  <div id="bar">
    <button data-r="0.55">1: Small</button>
    <button data-r="0.90" class="active">2: Medium</button>
    <button data-r="1.45">3: Large</button>
    <button id="btn-blast">F: Blast</button>
    <button id="btn-reset">R: Reset</button>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
