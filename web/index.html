<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A COOKED GOOSE // VOXEL HEIST</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #85b8e6;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #eef2f7;
      user-select: none;
    }
    canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
    #hud {
      position: fixed; top: 14px; left: 14px;
      width: 330px;
      background: rgba(16, 22, 34, 0.84);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 12px;
      line-height: 1.55;
      backdrop-filter: blur(6px);
      pointer-events: none;
    }
    #hud .title {
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #ffb86c;
      margin-bottom: 6px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      padding-bottom: 4px;
    }
    #timer-box {
      position: fixed; top: 14px; right: 14px;
      min-width: 210px;
      text-align: center;
      background: rgba(16, 22, 34, 0.86);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      padding: 10px 16px;
      pointer-events: none;
    }
    #phase-label { font-size: 11px; letter-spacing: 0.1em; color: #9fb3c8; }
    #timer-val { font-size: 28px; font-weight: 800; color: #ffd166; margin-top: 2px; }
    #timer-box.alarm #timer-val { color: #ff595e; }
    #timer-box.win #timer-val { color: #52d681; }
    #banner {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(12, 17, 27, 0.92);
      border: 2px solid #ffd166;
      border-radius: 12px;
      padding: 22px 30px;
      text-align: center;
      display: none;
      z-index: 10;
    }
    #banner h2 { font-size: 24px; margin-bottom: 8px; color: #ffd166; }
    #banner p { font-size: 13px; color: #cbd5e1; margin-bottom: 14px; }
    #banner button {
      background: #f27741; color: #fff; border: 0;
      border-radius: 999px; padding: 8px 18px;
      font: inherit; font-weight: 700; cursor: pointer;
    }
    #crosshair {
      position: fixed; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px; font-weight: 700;
      color: rgba(255, 255, 255, 0.92);
      text-shadow: 0 1px 3px rgba(0,0,0,0.75);
      pointer-events: none;
    }
    #bar {
      position: fixed; bottom: 14px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 8px;
      background: rgba(16, 22, 34, 0.84);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      padding: 6px 10px;
    }
    #bar button {
      background: #27344d; color: #eef2f7;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 999px;
      padding: 6px 12px;
      font: inherit; font-size: 12px;
      cursor: pointer;
    }
    #bar button.active { background: #f27741; color: #fff; border-color: #f27741; }
    #bar button:hover { filter: brightness(1.12); }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="hud">
    <div class="title">VOXEL HEIST (WEBGL2 // 25cm)</div>
    <div id="obj-info">TARGETS: 0 / 3 &nbsp;|&nbsp; CHARGES: 10</div>
    <div id="stats">VOXELS: -- | DEBRIS: 0 | FPS: --</div>
    <div>CLICK CANVAS: LOCK MOUSE</div>
    <div>LMB / F: USE TOOL &nbsp;|&nbsp; 1/2/3: TOOL</div>
    <div>WASD + E/Q: MOVE/FLY &nbsp;|&nbsp; R: RESTART</div>
  </div>
  <div id="timer-box">
    <div id="phase-label">PLANNING PHASE</div>
    <div id="timer-val">45.0s</div>
  </div>
  <div id="banner">
    <h2 id="banner-title">MISSION COMPLETE</h2>
    <p id="banner-sub"></p>
    <button id="banner-restart">Play Again (R)</button>
  </div>
  <div id="crosshair">+</div>
  <div id="bar">
    <button data-tool="0">1: Hammer (inf)</button>
    <button data-tool="1" class="active">2: Pipe Bomb</button>
    <button data-tool="2">3: C4</button>
    <button id="btn-blast">F: Fire</button>
    <button id="btn-reset">R: Restart</button>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
